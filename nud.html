<!DOCTYPE html>
<html lang="en">
<body style="background:#0f172a; color:#fff; font-family:sans-serif; display:flex; min-height:100vh; justify-content:center; align-items:center; margin:0;">
    <div style="background:#1e293b; padding:2rem; border-radius:8px; text-align:center; box-shadow:0 4px 6px rgba(0,0,0,0.3);">
        <h2>Interactive Card</h2>
        <p style="color:#94a3b8;">Click the button to update this text.</p>
        <button onclick="this.previousElementSibling.innerText='Button Clicked!'" style="background:#38bdf8; color:#0f172a; border:none; padding:8px 16px; border-radius:4px; font-weight:bold; cursor:pointer;">Click Me</button>
    </div>
</body>
</html>
